name: Build release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-attest:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # electron-builder launches a separate `npm rebuild` while packaging.
    # These settings must therefore apply to every step, not only `npm ci`.
    env:
      npm_config_python: python
      npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package-command: package-linux
            attestation-subject-path: |
              target/*.AppImage
              target/*.deb
              target/*.tar.gz
          - name: Windows
            # Node 14's bundled node-gyp cannot detect newer Visual Studio.
            # windows-2022 provides VS 2022 for the project node-gyp below.
            os: windows-2022
            package-command: package-windows
            attestation-subject-path: target/*.exe
          - name: macOS
            # macos-13 is no longer available as a standard hosted image.
            # Use the current Intel image so the release remains compatible
            # with existing x64 macOS installations. The build is unsigned.
            os: macos-15-intel
            package-command: package-mac-unsigned
            attestation-subject-path: target/*.dmg

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          # Node 14 ships npm/node-gyp 5, which uses Python's removed `rU`
          # file mode and therefore is incompatible with Python 3.11+.
          python-version: '3.10'

      - name: Install dependencies
        run: npm ci

      - run: npm --no-git-tag-version version ${{ github.ref_name }}

      - name: Build application
        run: npm run build-release

      - name: Package application
        run: npm run ${{ matrix.package-command }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.attestation-subject-path }}

      - name: Upload release assets for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.name }}
          path: ${{ matrix.attestation-subject-path }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish release
    needs: build-and-attest
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG already exists; resuming asset upload."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          fi

      - name: Upload release assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were downloaded.' >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            echo "Uploading ${asset}..."
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$asset"
            echo "Uploaded ${asset}."
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
