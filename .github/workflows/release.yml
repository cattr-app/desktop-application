name: Build release artifacts

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # electron-builder launches a separate `npm rebuild` while packaging.
    # These settings must therefore apply to every step, not only `npm ci`.
    env:
      npm_config_python: python
      npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package-command: package-linux
            assets: target/*.AppImage target/*.deb target/*.tar.gz
          - name: Windows
            # Node 14's bundled node-gyp cannot detect newer Visual Studio.
            # windows-2022 provides VS 2022 for the project node-gyp below.
            os: windows-2022
            package-command: package-windows
            assets: target/*.exe
          - name: macOS
            # macos-13 is no longer available as a standard hosted image.
            # Use the current Intel image so the release remains compatible
            # with existing x64 macOS installations. The build is unsigned.
            os: macos-15-intel
            package-command: package-mac-unsigned
            assets: target/*.dmg

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          # Node 14 ships npm/node-gyp 5, which uses Python's removed `rU`
          # file mode and therefore is incompatible with Python 3.11+.
          python-version: '3.10'

      - name: Install dependencies
        run: npm ci

      - run: npm --no-git-tag-version version ${{ github.event.release.tag_name }}

      - name: Build application
        run: npm run build-release

      - name: Package application
        run: npm run ${{ matrix.package-command }}

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" ${{ matrix.assets }} --clobber
